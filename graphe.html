<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphe 3D – Octothorp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0ede8; overflow: hidden; }
    #graph-container { width: 100vw; height: 100vh; }
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif;
      font-size: 14px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loader">Chargement du graphe…</div>
  <div id="graph-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>

  <script>
    // Parse GEXF manuellement (pas besoin de graphology)
    function parseGexf(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, "application/xml");

      const nodes = [];
      const links = [];

      doc.querySelectorAll("node").forEach(function(n) {
        nodes.push({
          id: n.getAttribute("id"),
          label: n.getAttribute("label") || n.getAttribute("id")
        });
      });

      doc.querySelectorAll("edge").forEach(function(e) {
        links.push({
          source: e.getAttribute("source"),
          target: e.getAttribute("target")
        });
      });

      return { nodes, links };
    }

    fetch("https://raw.githubusercontent.com/Octothorp-site/gexf-example/refs/heads/main/exemple-simple.gexf")
      .then(function(r) { return r.text(); })
      .then(function(xml) {
        document.getElementById("loader").style.display = "none";

        const graphData = parseGexf(xml);

        const Graph = ForceGraph3D()
          (document.getElementById("graph-container"))
          .graphData(graphData)
          .backgroundColor("#f0ede8")
          .nodeLabel("label")
          .nodeColor(function() { return "#6b5a7e"; })
          .nodeOpacity(0.9)
          .linkColor(function() { return "#c0b8ca"; })
          .linkOpacity(0.6)
          .linkWidth(1.2)
          .enableNodeDrag(true)
          .enableNavigationControls(true)
          .showNavInfo(false);

        // Rotation automatique
        let angle = 0;
        setInterval(function() {
          Graph.cameraPosition({
            x: 300 * Math.sin(angle),
            z: 300 * Math.cos(angle)
          });
          angle += 0.005;
        }, 16);
      })
      .catch(function() {
        document.getElementById("loader").textContent = "Impossible de charger le graphe.";
      });
  </script>
</body>
</html>
